<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home | Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <!--HEADER-->
    <header>
        <div class="logo">
            M.TAWFIKS
            <span>SMART HOME</span>
        </div>
        <nav>
            <a href="home.html">HOME</a>
            <a href="zones.html">ZONES</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>
    <!--CONTACT-->
    <main>
        <section class="contact-page">
            <div class="contact-content">
                <p class="small-title">SMART HOME SUPPORT</p>
                <h1>CONTACT US</h1>
                <p>
                    Need help with your smart home?
                    Send us a ticket and our team will
                    get back to you.
                </p>
                <form>
                    <label for="name">
                        NAME
                    </label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >
                    <label for="email">
                        EMAIL
                    </label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >
                    <label for="message">
                        MESSAGE
                    </label>
                    <textarea
                        id="message"
                        rows="6"
                        placeholder="Describe your problem..."
                    ></textarea>
                    <button type="submit">
                        SEND TICKET
                    </button>
                </form>
            </div>
        </section>
    </main>
    <!--FOOTER-->
    <footer>
        <p>Made By Malek Tawfik</p>
    </footer>
</body>
</html>
